  - name: CF优选 # CloudFlare优选组只测EdgeTunnel订阅的节点 负载均衡 轮询
    type: load-balance
    strategy: consistent-hashing # consistent-hashing 表示负载均衡策略为一致性散列Hash | round-robin 表示负载均衡策略为轮询
    use: [EdgeTunnel]
    include-self: false
    interval: 300
    hidden: true
    icon: https://raw.githubusercontent.com/han1182/ProxyRules/refs/heads/master/icon/good.svg

  - name: 所有-手选 # 所有节点手动选择 手动选择包含了所有节点
    type: select
    include-all: true
    include-self: false
    filter: "^((?!(DIRECT|REJECT)).)*$"
    exclude-filter: "(CF优选|DIRECT|REJECT|CN|中国|回国)"
    icon: https://raw.githubusercontent.com/han1182/ProxyRules/refs/heads/master/icon/Manual.svg
    proxies: [PASS]

  - name: 所有-智选 # 所有节点smart智能选择 智能选择引用useProviders的节点，去掉了垃圾订阅
    <<: *regionTemplate
    lazy: false
    filter: "^((?!(DIRECT|REJECT)).)*$"
    exclude-filter: "(CF优选|DIRECT|REJECT|CN|中国|回国)"
    icon: https://raw.githubusercontent.com/han1182/ProxyRules/refs/heads/master/icon/auto.svg

script: # 脚本引擎
  engine: expr # starlark 功能更强但更慢（10-20倍）
  shortcuts:
    browser: resolve_process_name() in ['chrome', 'firefox', 'edge'] # 浏览器进程

rules: # 规则引擎

  - RULE-SET,Mine_Direct,国内
  - RULE-SET,Mine_Proxy,国外
  - RULE-SET,Mine_Reject,拦截
  - RULE-SET,Download_list,下载
  - RULE-SET,ChinaDNS,国内,no-resolve

  - RULE-SET,LocalAreaNetwork,DIRECT,no-resolve

