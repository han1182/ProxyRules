anchors: # 锚点

  clashConfig: &clashConfig # Clash 主配置
    mode: rule
    ipv6: true
    port: 7890
    socks-port: 7891
    redir-port: 7892
    mixed-port: 7893
    tproxy-port: 7895
    allow-lan: true
    bind-address: "*"
    log-level: warning        # silent | error | warning | info | debug
    find-process-mode: strict # 启用进程规则 off|strict|always
    global-ua: clash.meta
    etag-support: true        # 启用 ETag 支持 开启智能更新，只有内容变化时才会下载/false 每次都强制完整下载
    unified-delay: true       # 开启统一延迟时，会计算 RTT，以消除连接握手等带来的不同类型节点的延迟差异
    tcp-concurrent: true      # 是否开启 TCP 连接并发建立，开启后可以显著提升连接速度，但可能会增加服务器负载
    udp: true                 # 全局开启UDP
    memory-limit: "768M"      # 内存优化 “根据设备调整”
    geoip-dat: "./geoip.dat"
    geosite-dat: "./geosite.dat"
    global-client-fingerprint: chrome
    interface-name: ""               # 自动选择最佳网卡
    keep-alive-idle: 30              # 连接空闲多久后开始发送 keepalive 探测（秒）
    keep-alive-interval: 15          # 探测包发送间隔（秒） ← 你要设置的参数
    reuse-addr: true                 # 连接复用，是否允许重用本地地址（Windows 上通常强制开启）
    gc-interval: 30                  # 内存回收间隔（秒） ← 你要设置的参数
    disable-keep-alive: false        # 是否禁用 TCP keepalive（Android 上通常强制开启）
    external-doh-server: /dns-query  # 在external-controller启用DOH服务器 提供dns服务
    external-controller: 0.0.0.0:9090
    external-controller-tls: 0.0.0.0:9443
    external-controller-pipe: \\.\pipe\mihomo # Windows namedpipe API 监听地址 从Windows namedpipe访问api接口不会验证secret， 如果开启请自行保证安全问题
    external-controller-unix: mihomo.sock     # Unix socket API 监听地址 从Unix socket访问api接口不会验证secret， 如果开启请自行保证安全问题
    external-controller-cors:        # API CORS 标头配置
      allow-origins:
        - "*"
      allow-private-network: true
    external-ui: "./ui/zashboard"    # 外部用户界面
    external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
    geodata-loader: standard         # standard 标准加载器 | memconservative 专为内存受限 (小内存) 设备优化的加载器 (默认值)
    geo-auto-update: true
    geo-update-interval: 168 # 7天更新一次
    geodata-mode: true
    geox-url:
      geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
      geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
      mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
      asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
    tracing: false # 性能分析引擎

  sub-http: &sub-http # 机场订阅通用锚点
    useProviders: &useProviders [飞伐伐, 雷神, 小牛加速, 火箭云, 香草云, 爱大米, 红杏出墙, 小云朵, 便宜机场, 宝可梦星云, 水牛云, GGB, 轻语机场, 酷可云, 自由狗狗, 蛙爪云, 劳大云, OneLight, 翻了么, knotic, NEX, Acceleration, IKuuuVPN, 马铃薯, 聚合订阅]
    # 订阅基础配置
    subBase: &subBase {type: http, interval: 86400, health-check: {enable: true, interval: 600, url: https://cp.cloudflare.com/generate_204}}
    # 直连拉取订阅
    subHttpDirect: &subHttpDirect {<<: *subBase, proxy: DIRECT}
    # 代理拉取订阅
    subHttpProxy: &subHttpProxy {<<: *subBase, proxy: CF优选}

  group-anchor: &group-anchor # 策略组锚点
    # domestic 国内流量默认选择
    domestic: &domestic {type: select, proxies: [DIRECT, CF优选, 北美洲大陆, 南美洲大陆, 欧洲大陆, 亚洲大陆, 大洋洲大陆, 非洲大陆, 所有-智选, 所有-手选, REJECT-DROP], interval: 300, tolerance: 25, include-self: false}
    # abroad 默认国外地区选择
    abroad: &abroad {proxies: [北美洲大陆, 亚洲大陆, 欧洲大陆, 南美洲大陆, 大洋洲大陆, 非洲大陆, 所有-手选, REJECT-DROP], interval: 300, tolerance: 25, include-self: false}
    # 阻断-广告净化等
    Interrupt: &Interrupt {type: select, hidden: true, proxies: [REJECT-DROP, REJECT, DIRECT, 所有-智选, 所有-手选]} # REJECT-DROP 为丢包模式
    # 各地区智能选择组模板
    regionSmart: &regionSmart {type: smart, include-all-proxies: true, uselightgbm: true, collectdata: true, interval: 300, tolerance: 25, use: *useProviders, include-self: false, proxies: [PASS]}
    regionTemplate: &regionTemplate {<<: *regionSmart, include-self: false, hidden: true, icon: null} # 保留公共参数

