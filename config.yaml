tun: # TUN 模块
  enable: true
  stack: mixed # system/gvisor/mixed | 如无使用问题，建议使用 mixed栈，默认 gvisor | 如果打开了防火墙，则无法使用 system 和 mixed 协议栈，需要放行
  device: utun # 指定 tun 网卡名称，MacOS 设备只能使用 utun 开头的网卡名
  auto-route: true # 自动设置全局路由，可以自动将全局流量路由进入 tun 网卡。
  auto-redirect: true # 仅支持 Linux，自动配置 iptables/nftables 以重定向 TCP 连接，需要auto-route已启用
  auto-detect-interface: true # 自动选择流量出口接口，多出口网卡同时连接的设备建议手动指定出口网卡
  dns-hijack:
    - udp://any:53
    - tcp://any:53
    - tcp://any:853   # DoT
    - any:53          # 保留兼容
  # route-exclude-address: # 启用 auto-route 时排除自定义网段
    # - 192.168.0.0/16
    # - 172.16.0.0/12
    # - 10.0.0.0/8
    # - 127.0.0.0/8
  mtu: 9000 # 最大传输单元，会影响极限状态下的速率，一般用户默认即可。
  gso: true # 启用通用分段卸载，仅支持 Linux
  gso-max-size: 65536 # 数据块的最大长度
  udp-timeout: 500 # UDP NAT 过期时间，以秒为单位，默认为 300(5 分钟)
  iproute2-table-index: 2022 # auto-route 生成的 iproute2 路由表索引，默认使用 2022
  iproute2-rule-index: 9000 # auto-route 生成的 iproute2 规则起始索引，默认使用 9000
  endpoint-independent-nat: true # 启用端点独立 NAT，解决部分运营商 NAT 过于严格导致的 UDP 连接问题 | 性能可能会略有下降，所以不建议在不需要的时候开启。
  strict-route: true # 启用 auto-route 时执行严格的路由规则  
  include-package: # 包含的 Android 应用包名，使其被 Tun 路由流量，未配置的应用包不会被 Tun 路由流量
    - com.android.chrome
  exclude-package: # 排除 Android 应用包名，使其避免被 Tun 路由流量
    - com.android.captiveportallogin

