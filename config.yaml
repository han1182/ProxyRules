ntp: # 网络时间协议配置
  enable: true
  server: time.apple.com
  port: 123
  interval: 30
  write-to-system: true
  dialer-proxy: DIRECT

experimental: # 实验性功能
  sniff-tls-sni: true
  quic-go-disable-gso: false
  quic-go-disable-ecn: false
  dialer-ip4p-convert: false
  disable-udp: false
  force-dns-mapping: true
  tls-fragment: # TLS 分片，防主动探测效果不错
    enable: true
    size: 100-300 # 推荐范围
    sleep: 10-50ms
    udp-gso: true # 大文件下载加速（需测试）

<<: *clashConfig # 引入 Clash 主配置
