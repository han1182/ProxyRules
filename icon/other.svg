<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  
  <!-- 添加样式控制颜色自适应 -->
  <style>
    /* 浅色模式默认黑色 */
    svg {
      color: #000000;
    }
    /* 深色模式变为白色 */
    @media (prefers-color-scheme: dark) {
      svg {
        color: #ffffff;
      }
    }
  </style>

  <!-- 底层虚线圆环，代表仪表盘/流量生态 -->
  <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.4" />
  
  <!-- 主线流量（右侧加粗箭头） -->
  <line x1="3" y1="12" x2="9" y2="12" stroke-width="2.5" />
  <polyline points="7,9.5 10,12 7,14.5" stroke-width="2.5" />
  
  <!-- 其他流量 1（下方箭头） -->
  <line x1="12" y1="3" x2="12" y2="9" stroke-width="1.5" />
  <polyline points="9.5,7 12,10 14.5,7" stroke-width="1.5" />
  
  <!-- 其他流量 2（左侧箭头） -->
  <line x1="15" y1="12" x2="21" y2="12" stroke-width="1.5" />
  <polyline points="17,9.5 20,12 17,14.5" stroke-width="1.5" />
  
  <!-- 其他流量 3（上方箭头） -->
  <line x1="12" y1="15" x2="12" y2="21" stroke-width="1.5" />
  <polyline points="9.5,17 12,20 14.5,17" stroke-width="1.5" />
  
  <!-- 中心聚合节点 -->
  <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none" />
</svg>
